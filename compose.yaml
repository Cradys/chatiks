services:
  database:
    container_name: chatiks-db
    restart: "unless-stopped"
    image: postgres:18.3
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql

volumes:
  pg-data: